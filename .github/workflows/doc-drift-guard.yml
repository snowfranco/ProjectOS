name: Doc drift guard (reusable)

# Hosted centrally in the PMAWS repo. Other repos call it via `uses:`.
# Detects when code has moved but the OS docs have not, and opens (or closes)
# a single tracking issue in the calling repo.

on:
  workflow_call:
    inputs:
      doc_paths:
        description: "Space-separated docs that must track reality"
        type: string
        default: "ROADMAP.md PROJECT_OS.md"
      commit_threshold:
        description: "Code commits since last doc update before we complain"
        type: number
        default: 5
      day_threshold:
        description: "Days since last doc update before we complain"
        type: number
        default: 14

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect drift
        id: drift
        env:
          DOC_PATHS: ${{ inputs.doc_paths }}
          COMMIT_THRESHOLD: ${{ inputs.commit_threshold }}
          DAY_THRESHOLD: ${{ inputs.day_threshold }}
        run: |
          set -euo pipefail

          existing=""
          for f in $DOC_PATHS; do [ -f "$f" ] && existing="$existing $f"; done

          # No OS files at all is itself drift: the repo has not been bootstrapped.
          if [ -z "$existing" ]; then
            {
              echo "drift=true"
              echo "reason=This repo has no ROADMAP.md or PROJECT_OS.md. Run the project-os skill to bootstrap it."
              echo "commits=0"
              echo "days=0"
              echo "recent<<EOF"
              echo "- (none)"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_doc=$(git log -1 --format=%cI -- $existing)

          commits=$(git log --since="$last_doc" --format=%h \
            -- . ':(exclude)*.md' ':(exclude)docs/**' ':(exclude).github/**' \
            | wc -l | tr -d ' ')

          days=$(( ( $(date +%s) - $(date -d "$last_doc" +%s) ) / 86400 ))

          drift=false
          reason=""
          if [ "$commits" -ge "$COMMIT_THRESHOLD" ]; then
            drift=true
            reason="$commits code commits have landed since the docs last moved."
          elif [ "$days" -ge "$DAY_THRESHOLD" ] && [ "$commits" -ge 1 ]; then
            drift=true
            reason="Docs untouched for $days days while $commits code commits landed."
          fi

          recent=$(git log --since="$last_doc" --format='- %h %s' \
            -- . ':(exclude)*.md' | head -15)

          {
            echo "drift=$drift"
            echo "reason=$reason"
            echo "commits=$commits"
            echo "days=$days"
            echo "recent<<EOF"
            echo "$recent"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.drift.outputs.reason }}
          COMMITS: ${{ steps.drift.outputs.commits }}
          DAYS: ${{ steps.drift.outputs.days }}
          RECENT: ${{ steps.drift.outputs.recent }}
        run: |
          set -euo pipefail

          gh label create doc-drift --color D93F0B \
            --description "Docs no longer describe reality" 2>/dev/null || true

          printf '%s\n\n**Since the docs last moved:** %s code commits, %s days.\n\nCommits the docs do not reflect:\n\n%s\n\n## To close\nRun `session-close` on this repo, or update the OS files by hand. This issue closes itself on the next run once the docs move.\n\n_Opened by doc-drift-guard._\n' \
            "$REASON" "$COMMITS" "$DAYS" "$RECENT" > body.md

          # One issue per repo, edited in place, so this never becomes a weekly spam.
          num=$(gh issue list --label doc-drift --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file body.md
          else
            gh issue create \
              --title "Doc drift: the roadmap no longer describes this repo" \
              --label doc-drift --body-file body.md
          fi

      - name: Close it when the docs catch up
        if: steps.drift.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num=$(gh issue list --label doc-drift --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "Docs are back in sync. Closing."
          fi
